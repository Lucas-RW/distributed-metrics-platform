# TEMPLATE ONLY — do not fill in real values and commit this file.
#
# Create the real Secret imperatively instead, so credentials never touch
# git history:
#
#   kubectl create secret generic distributed-metrics-db-credentials \
#     --namespace distributed-metrics \
#     --from-literal=DB_USER='neondb_owner' \
#     --from-literal=DB_PASSWORD='<your-neon-password>'
#
# (neondb_owner is this project's actual Neon role, from the Connect modal
# in the Neon Console — not the same as the metrics_user role used by the
# separate local docker-compose Postgres. Grab the password from that same
# Connect modal.) If you do want it as a checked-in manifest for a
# throwaway local cluster, copy this file to 02-secret.yaml, fill in
# stringData below, keep it out of git (already covered by the
# k8s/*.secret.yaml pattern — add one to .gitignore), and `kubectl apply
# -f` it.
apiVersion: v1
kind: Secret
metadata:
  name: distributed-metrics-db-credentials
  namespace: distributed-metrics
  labels:
    app.kubernetes.io/name: distributed-metrics-platform
    app.kubernetes.io/part-of: distributed-metrics-platform
type: Opaque
stringData:
  DB_USER: "neondb_owner"
  DB_PASSWORD: "REPLACE_ME"
